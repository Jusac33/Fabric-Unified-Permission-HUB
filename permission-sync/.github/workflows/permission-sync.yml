name: permission-sync

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "full_reconcile"
        type: choice
        options: [full_reconcile, event_accelerator]
      dry_run:
        description: "Dry run"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  id-token: write     # required for azure/login@v2 OIDC
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: permission-sync
    env:
      RUNNING_IN_AZURE: "1"
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      KEY_VAULT_URI: ${{ vars.KEY_VAULT_URI }}
      DRY_RUN: ${{ inputs.dry_run || 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Azure login (OIDC federated credential)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run permission-sync
        run: |
          python -m src.orchestrator.sync_engine \
            --config config/settings.yaml \
            --mode ${{ inputs.mode || 'full_reconcile' }}

      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-logs-${{ github.run_id }}
          path: permission-sync/logs/
          if-no-files-found: ignore
