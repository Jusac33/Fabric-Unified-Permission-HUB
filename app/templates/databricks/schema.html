{% extends "base.html" %}
{% block content %}
<a href="/databricks/catalog/{{ catalog }}?workspace_url={{ workspace_url }}" class="text-sm text-slate-500 hover:underline">← {{ catalog }}</a>
<h1 class="text-2xl font-bold mt-2 mb-4">{{ catalog }}.{{ schema }}</h1>

<div id="page-data"
     hx-get="/databricks/catalog/{{ catalog }}/schema/{{ schema }}/_data?workspace_url={{ workspace_url }}"
     hx-trigger="load"
     hx-swap="innerHTML">
  {% include "_loading.html" %}
</div>
{% endblock %}
