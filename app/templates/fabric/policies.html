{% extends "base.html" %}
{% block content %}
<a href="/fabric/workspaces/{{ workspace_id }}" class="text-sm text-slate-500 hover:underline">← Workspace</a>
<h1 class="text-2xl font-bold mt-2 mb-1">OneLake Data Access Policies</h1>
<div class="text-xs text-slate-500 font-mono mb-4">Item {{ item_id }}</div>

<div id="page-data"
     hx-get="/fabric/workspaces/{{ workspace_id }}/items/{{ item_id }}/policies/_data"
     hx-trigger="load"
     hx-swap="innerHTML">
  {% include "_loading.html" %}
</div>
{% endblock %}
