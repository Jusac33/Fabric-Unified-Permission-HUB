{% extends "base.html" %}
{% block content %}
<a href="/fabric" class="text-sm text-slate-500 hover:underline">← Workspaces</a>
<div class="flex items-start justify-between mt-2 mb-6">
  <div>
    <h1 class="text-2xl font-bold">{{ workspace_id }}</h1>
    <div class="text-xs text-slate-500 font-mono">{{ workspace_id }}</div>
  </div>
  <form method="post" action="/pairings/wizard/select-fabric" class="text-sm">
    <input type="hidden" name="workspace_id" value="{{ workspace_id }}" />
    <input type="hidden" name="workspace_name" value="" />
    <input type="hidden" name="back" value="/pairings/wizard" />
    <button class="bg-emerald-700 text-white px-3 py-1.5 rounded">Select for pairing →</button>
  </form>
</div>

<div id="page-data"
     hx-get="/fabric/workspaces/{{ workspace_id }}/_data"
     hx-trigger="load"
     hx-swap="innerHTML">
  {% include "_loading.html" %}
</div>
{% endblock %}
