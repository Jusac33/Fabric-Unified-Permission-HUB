{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-between mb-6">
  <div>
    <h1 class="text-2xl font-bold">Workspace pairings</h1>
    <p class="text-sm text-slate-500">Map a Databricks workspace + Unity Catalog to a Fabric workspace. Permission-sync uses these pairings as its source-to-target routing table.</p>
  </div>
  <a href="/pairings/wizard" class="bg-emerald-700 text-white px-4 py-2 rounded text-sm">Start pairing wizard →</a>
</div>

<div id="page-data"
     hx-get="/pairings/_data{% if request.url.query %}?{{ request.url.query }}{% endif %}"
     hx-trigger="load"
     hx-swap="innerHTML">
  {% include "_loading.html" %}
</div>
{% endblock %}
