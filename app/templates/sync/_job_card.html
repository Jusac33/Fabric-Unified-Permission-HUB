<div class="bg-white rounded-xl shadow p-4">
  <div class="flex items-center justify-between">
    <div>
      <div class="text-sm">
        <span class="font-mono text-xs text-slate-500">{{ job.id }}</span>
        <span class="ml-2 font-medium">{{ job.source_type }}</span>
        <span class="text-slate-500">{{ job.config_path }}</span>
      </div>
      <div class="text-xs text-slate-500">
        {{ job.started_at }} → {{ job.finished_at or "running…" }}
      </div>
    </div>
    <span class="text-xs px-2 py-1 rounded
      {% if job.status == 'success' %}bg-emerald-100 text-emerald-800
      {% elif job.status == 'failed' %}bg-rose-100 text-rose-800
      {% else %}bg-slate-100 text-slate-700{% endif %}">{{ job.status }}</span>
  </div>
  {% if job.error %}<div class="mt-2 text-rose-700 text-sm">{{ job.error }}</div>{% endif %}
  <details class="mt-3">
    <summary class="text-xs text-slate-500 cursor-pointer">Logs</summary>
    <pre class="mt-2 text-xs bg-slate-900 text-slate-100 p-3 rounded max-h-80 overflow-auto">{{ job.log_tail() }}</pre>
  </details>
  <a href="/sync/job/{{ job.id }}" class="text-xs text-emerald-700 hover:underline">Open →</a>
</div>
