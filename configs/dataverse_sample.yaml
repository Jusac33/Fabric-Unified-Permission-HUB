# Dataverse source — sample (Beta upstream). Rename to dataverse_<env>.yaml.
type: DATAVERSE
service_principal:
  tenant_id: <azure-tenant-id>
  client_id: <sp-client-id>
  client_secret: <sp-client-secret>
source:
  name: https://yourorg.crm.dynamics.com
dataverse:
  environment_url: https://yourorg.crm.dynamics.com
fabric:
  workspace_id: <fabric-workspace-id>
  mirror_id: <fabric-mirror-id>
  mirror_name: DATAVERSE_MIRROR
  fabric_role_suffix: PW
  delete_default_reader_role: true
  policy_mapping: role_based   # role_based recommended for Dataverse
constraints:
  columns:
    columnlevelsecurity: true
    fallback: deny
  rows:
    rowlevelsecurity: false
    fallback: deny
